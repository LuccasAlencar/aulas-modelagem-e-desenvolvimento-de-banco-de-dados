site_name: Modelagem e Desenvolvimento de Banco de Dados
site_description: Site de aulas e materiais didáticos da matéria "Modelagem e Desenvolvimento de Banco de Dados"
site_author: Luccas Alencar

# Repositório (substitua pelo seu)
repo_name: LuccasAlencar/aulas-modelagem-e-desenvolvimento-de-banco-de-dados
repo_url: https://github.com/LuccasAlencar/aulas-modelagem-e-desenvolvimento-de-banco-de-dados

# Tema
theme:
  name: material
  language: pt-BR
  palette:
    # Modo claro
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Mudar para modo escuro
    # Modo escuro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Mudar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
    - navigation.footer

# Plugins
plugins:
  - search:
      lang: pt

# Extensões Markdown
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.mark
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Navegação
nav:
  - Home: index.md
  - Aulas:
    - Aula 1 - Introdução à modelagem de banco de dados : aulas/aula1.md
    - Aula 2 - Levantamento de requisitos e análise de dados : aulas/aula2.md
    - Aula 3 - Modelo Entidade-Relacionamento (ER) : aulas/aula3.md
    - Aula 4 - Ferramentras de modelagem de banco de dados : aulas/aula4.md
    - Aula 5 - Relacionamentos um-para-um: aulas/aula5.md
    - Aula 6 - Relacionamentos um-para-muitos: aulas/aula6.md
    - Aula 7 - Relacionamentos muitos-para-muitos: aulas/aula7
    - Aula 8 - Resolução de relacionamentos complexos: aulas/aula8.md
    - Aula 9 - Normalização de banco de dados: aulas/aula9.md
    - Aula 10 - Primeira Forma Normal (1NF): aulas/aula10.md
    - Aula 11 - Segunda Forma Normal (2NF): aulas/aula11.md
    - Aula 12 - Casos práticos de normalização: aulas/aula12.md
    - Aula 13 - Terceira Forma Normal (3NF): aulas/aula13.md
    - Aula 14 - Forma Normal de Boyce-Codd (BCNF): aulas/aula14.md



extra:
  generator: false